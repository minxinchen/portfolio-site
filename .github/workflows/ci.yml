name: CI — Test & Build WP Search Lab

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit & boundary tests
        run: npm test

      - name: Rebuild self-contained WP Search Lab HTML
        run: npm run build

      - name: Verify committed build artifact is up to date
        run: git diff --exit-code public/tools/wp-search-lab/index.html
