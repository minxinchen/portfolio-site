/* Portfolio theme: shared paper, ink, accent and typography with the Nio homepage. */
:root{--ink:#302b28;--muted:#796e66;--brand:#8d543a;--brand-dark:#70402e;--line:#e7ddd3;--glass:#fffdf9;--shadow:0 12px 38px rgba(74,50,37,.04);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fcfaf6}
body{background:#fcfaf6}.portfolio-header{height:82px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 36px;background:#fcfaf6f5;border-bottom:1px solid var(--line)}.portfolio-logo{display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink)}.portfolio-logo strong{font:700 32px/1 Georgia,serif;letter-spacing:-.08em}.portfolio-logo strong span{color:#b17353}.portfolio-logo small{font-size:10px;letter-spacing:.18em;color:var(--muted)}.portfolio-header nav{display:flex;align-items:center;gap:28px}.portfolio-header nav a{font-size:13px;color:#6f645c;text-decoration:none}.portfolio-header nav a:hover{text-decoration:underline}.portfolio-header nav .current-tool{border:1px solid #d9cec4;border-radius:30px;padding:8px 14px;color:#8d543a}
.workspace{min-height:calc(100vh - 82px)}.sidebar{top:82px;height:calc(100vh - 82px);background:#f4eee7;border-right:1px solid var(--line);backdrop-filter:none}.brand-mark{background:#38302d;box-shadow:none;border-radius:12px}.brand small{letter-spacing:1px}.sidebar-label{margin-top:30px}.nav-item.active{background:#eadacb;border-color:#e3d4c7;box-shadow:none}.nav-item:hover{background:#ede3d8}.panel{border:1px solid var(--line);border-radius:20px;backdrop-filter:none}.sample-panel{background:#f4eee7}.primary{background:#38302d;border-color:#38302d;border-radius:28px;box-shadow:none}.primary:hover{background:#655147}.quiet{background:#fcfaf6;border-color:#d9cec4;border-radius:20px}.soft{background:#f4eee7;border-color:var(--line);color:#6a564a}.step{background:#f4eee7}.text-button{color:#8d543a}.notice{background:#f4eee7;border-color:#d9cec4;color:#544c46}.url-check{margin:20px 0}.url-check input[type=url]{font-size:16px;padding:15px;border-radius:12px;background:#fcfaf6;border:1px solid #cdbbab}.url-check .primary{width:100%;padding:13px 18px;margin-top:14px;font-size:15px}.fetch-note{font-size:12px;color:var(--muted);line-height:1.75;margin:14px 0 0}.advanced-import{margin-top:24px}.actions[hidden]{display:none}.upload-zone{background:#fcfaf6}.busy #notice{animation:fetch-pulse 1.4s ease-in-out infinite}.busy #main{cursor:progress}@keyframes fetch-pulse{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){.busy #notice{animation:none}}
@media(max-width:700px){.portfolio-header{height:70px;padding:0 17px;gap:12px}.portfolio-logo small{display:none}.portfolio-header nav{gap:14px}.portfolio-header nav a{font-size:12px}.portfolio-header nav .current-tool{padding:6px 9px}.portfolio-header nav a[href="/journal/index.html"],.portfolio-header nav a[href="/about.html"]{display:none}.sidebar{height:auto;top:auto;border-bottom:1px solid var(--line)}.sidebar nav{margin-top:12px}.brand-mark{display:none}.brand small{display:none}.brand{font-size:15px}.workspace{min-height:calc(100vh - 70px)}.panel{border-radius:16px}.page-intro h1{font-size:27px}.steps{display:none}.topbar{padding:12px 0}.two-col{gap:6px}}

/* v0.3 No-Code visual hierarchy, status colors, SERP preview & outline */
.status.PASS{background:#e7f3ec;color:#246342}
.status.FAIL{background:#fce8e6;color:#a53028}
.status.WARNING{background:#fef3da;color:#8c5d12}
.status.UNKNOWN{background:#efeae4;color:#6b625b}
.status.NOT_APPLICABLE{background:#f3efea;color:#8d837a}
.dim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.dim-card{background:#fffdf9;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:16px 18px}
.dim-card.good{border-left-color:#2e7d52}
.dim-card.warn{border-left-color:#d4901e}
.dim-card.bad{border-left-color:#c94238}
.dim-label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.dim-card strong{display:block;font-size:20px;margin:4px 0 2px;color:var(--ink)}
.dim-card small{font-size:12px;color:var(--muted)}
.serp-card{background:#fff;border:1px solid #e6dfd6;border-radius:12px;padding:16px 18px}
.serp-url{font-size:12px;color:#4d5156;margin-bottom:4px;overflow-wrap:anywhere}
.serp-title{font-size:18px;line-height:1.35;color:#1a0dab;font-weight:500;margin-bottom:6px;overflow-wrap:anywhere}
.serp-title.is-missing{color:#a53028;font-style:italic}
.serp-desc{font-size:13px;line-height:1.55;color:#4d5156;overflow-wrap:anywhere}
.serp-desc.is-missing{color:#8c5d12;font-style:italic}
.serp-hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.serp-warn{font-size:11px;padding:4px 9px;border-radius:99px;background:#fef3da;color:#8c5d12;font-weight:600}
.mini-metrics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mini-metrics span{font-size:12px;padding:4px 10px;border-radius:99px;background:#f4eee7;color:#544c46}
.outline-list{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto}
.outline-item{font-size:12px;color:var(--ink);padding:5px 0;border-bottom:1px dashed #ece3d8;display:flex;align-items:baseline;gap:8px}
.outline-item span{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:#f4eee7;color:#8d543a;flex-shrink:0}
.outline-item.h2{padding-left:14px}
.outline-item.h3{padding-left:28px}
.outline-item.h4{padding-left:42px}
.outline-more{font-size:11px;color:var(--muted);padding-top:6px}
.top-section{margin-bottom:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:18px}
.priority-card{border:1px solid #dccab8;border-left:4px solid #8d543a;background:#fffdf9}
.cat-tag{display:inline-block;font-size:10px;font-weight:700;color:#8d543a;background:#f4eee7;padding:2px 8px;border-radius:99px;margin-bottom:6px}
.plain-guide{background:#faf6f0;border:1px solid #ece3d8;border-radius:11px;padding:13px 16px;margin:10px 0;font-size:13px;color:#473f3a}
.plain-guide p{margin:0 0 8px}
.step-list{margin:6px 0 0;padding-left:20px}
.step-list li{margin:4px 0}
.tech-details{margin:8px 0 0}
.tech-details summary{font-size:11px;color:var(--muted);font-weight:500}
.primary-soft{background:#38302d;color:#fff;border:1px solid #38302d;border-radius:99px;font-size:12px;padding:7px 14px}
.primary-soft:hover{background:#5c4a42}
.external-box{margin-top:24px;background:#f4eee7}
.quiet-link{display:inline-block;text-decoration:none;background:#fcfaf6;border:1px solid #d9cec4;border-radius:99px;padding:7px 14px;font-size:12px;color:#544c46;font-weight:600}
.quiet-link:hover{background:#fff;border-color:#8d543a;color:#8d543a}
.divider{border:0;border-top:1px solid var(--line);margin:16px 0}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.preview-head h2{margin:0}
.preview-tabs{display:inline-flex;gap:4px;background:#f4eee7;padding:3px;border-radius:99px;border:1px solid var(--line)}
.preview-tabs button{padding:4px 12px;font-size:12px;border-radius:99px;background:transparent;color:var(--muted)}
.preview-tabs button.active{background:#38302d;color:#fff}
.social-card{background:#fff;border:1px solid #e6dfd6;border-radius:12px;overflow:hidden}
.social-thumb{padding:18px;background:#f7f2eb;border-bottom:1px solid #ece3d8;text-align:center;color:#8c5d12;font-size:12px;font-weight:600}
.social-thumb.has-img{background:#eef6f1;color:#246342}
.social-thumb small{display:block;font-weight:400;color:var(--muted);margin-top:4px;overflow-wrap:anywhere;font-size:11px}
.social-meta{padding:14px 16px}
.social-host{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.social-title{font-size:15px;font-weight:700;color:var(--ink);margin:4px 0}
.social-desc{font-size:12px;color:#544c46;line-height:1.5}
.wp-badge{background:#eadacb!important;color:#70402e!important;font-weight:600}
@media(max-width:700px){.dim-grid{grid-template-columns:1fr}}
